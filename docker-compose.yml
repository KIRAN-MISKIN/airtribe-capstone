version: '3.9'

services:
  postgres:
    image: postgres:16-alpine
    container_name: chronos-postgres
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: Miskin123
      POSTGRES_DB: chronos
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 10s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    container_name: chronos-redis
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  api:
    image: endlesskiran/airtribe-capstone:latest
    container_name: chronos-api
    ports:
      - "3000:3000"
    environment:
      PORT: 3000
      NODE_ENV: production
      DATABASE_URL: postgresql://postgres:Miskin123@postgres:5432/chronos
      REDIS_HOST: redis
      REDIS_PORT: 6379
      JWT_SECRET: super-secret-key-for-chronos-123
      WEBHOOK_SECRET: change-me
      ADMIN_USER: admin
      ADMIN_PASS: changeme
      WORKER_CONCURRENCY: 5
      WORKER_QUEUE_NAME: job-queue
      WORKER_FAILED_QUEUE_NAME: job-queue-failed
      JOB_ATTEMPTS: 3
      JOB_BACKOFF_DELAY: 2000
      REMOVE_ON_COMPLETE: 100
      REMOVE_ON_FAIL: 500
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    restart: unless-stopped

  worker:
    image: endlesskiran/airtribe-capstone:latest
    container_name: chronos-worker
    command: ["node", "src/worker.js"]
    environment:
      NODE_ENV: production
      DATABASE_URL: postgresql://postgres:Miskin123@postgres:5432/chronos
      REDIS_HOST: redis
      REDIS_PORT: 6379
      JWT_SECRET: super-secret-key-for-chronos-123
      WEBHOOK_SECRET: change-me
      WORKER_CONCURRENCY: 5
      WORKER_QUEUE_NAME: job-queue
      WORKER_FAILED_QUEUE_NAME: job-queue-failed
      JOB_ATTEMPTS: 3
      JOB_BACKOFF_DELAY: 2000
      REMOVE_ON_COMPLETE: 100
      REMOVE_ON_FAIL: 500
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    restart: unless-stopped

volumes:
  postgres_data:
